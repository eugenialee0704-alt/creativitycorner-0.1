<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin records - 管理員紀錄</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF6B8B;
            --teal: #4ECDC4;
            --ink: #333;
            --paper: #FFF9E6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Nunito, sans-serif;
            color: var(--ink);
            background: var(--paper);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 18px 24px;
            background: linear-gradient(90deg, var(--pink), #c9a0dc 55%, var(--teal));
            color: white;
        }
        header a { color: white; }
        h1 { margin: 0; font-size: 1.6rem; }
        header p { margin: 4px 0 0; }
        button, .lang-switch button {
            border: 0;
            border-radius: 999px;
            padding: 8px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 44px;
        }
        .primary { background: white; color: var(--pink); }
        .quiet { background: rgba(255,255,255,0.2); color: white; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }
        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        label { display: block; font-weight: 700; margin: 12px 0 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font: inherit;
            font-size: 16px;
            touch-action: manipulation;
        }
        .error { color: #b42318; min-height: 1.2em; margin-top: 10px; }
        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 18px; }
        .user-button {
            display: block;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 2px solid #f3d5de;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .user-button.selected { border-color: var(--pink); background: #fff5f8; }
        .user-button strong { display: block; }
        .user-button span { color: #777; font-size: 0.9rem; }
        .record h2 { margin-top: 0; color: var(--pink); }
        .record h3 { margin: 22px 0 8px; color: #8a6500; }
        .input-block {
            margin: 12px 0 16px;
            padding: 14px 16px 8px;
            border: 2px solid #f3d5de;
            border-radius: 14px;
            background: #fffdf8;
        }
        .input-block h4 { margin: 0 0 8px; color: #1e3a8a; }
        .line { margin: 4px 0; }
        .muted { color: #888; }
        .danger {
            width: 100%;
            margin-bottom: 8px;
            background: #b42318;
            color: white;
        }
        .delete-user { width: auto; }
        .clean-status { min-height: 1.2em; margin: 0 0 12px; font-weight: 700; color: #b42318; }
        img.drawing, img.signature {
            display: block;
            max-width: min(100%, 520px);
            margin-top: 8px;
            border-radius: 12px;
            background: white;
            border: 1px solid #eee;
        }
        .hidden { display: none; }
        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 class="lang-en">Admin records</h1>
            <h1 class="lang-zh hidden">管理員紀錄</h1>
            <p class="lang-en">Sign in to see each child's information, drawing, and activity answers.</p>
            <p class="lang-zh hidden">登入後可以查看每位參加者的資料、圖畫和所有活動答案。</p>
        </div>
        <div>
            <button class="quiet" id="langBtn" type="button">中文</button>
            <a href="index.html" class="quiet" style="display:inline-block;text-decoration:none;border-radius:999px;padding:8px 16px;">Home</a>
            <button class="quiet hidden" id="logoutBtn" type="button">Log out</button>
        </div>
    </header>
    <main>
        <section class="card" id="loginCard">
            <h2 class="lang-en">Admin sign in</h2>
            <h2 class="lang-zh hidden">管理員登入</h2>
            <form id="loginForm">
                <label class="lang-en" for="username">Username</label>
                <label class="lang-zh hidden" for="username">用戶名</label>
                <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <label class="lang-en" for="password">Password</label>
                <label class="lang-zh hidden" for="password">密碼</label>
                <input id="password" name="password" type="password" autocomplete="current-password">
                <p class="error" id="loginError"></p>
                <button class="primary" id="loginBtn" type="submit">Sign in</button>
            </form>
        </section>
        <section class="layout hidden" id="records">
            <div>
                <button class="danger" id="cleanUsersBtn" type="button">Clean all user data</button>
                <p class="clean-status" id="cleanStatus"></p>
                <div class="card" id="userList"></div>
            </div>
            <div class="card record" id="userRecord">
                <p class="muted lang-en">Choose a name to see what that child saved.</p>
                <p class="muted lang-zh hidden">請選擇一個名字，查看該參加者保存的內容。</p>
            </div>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script>
        let language = 'en';
        let authHeader = sessionStorage.getItem('cc_admin_auth') || '';
        let selectedUser = null;

        function applyLanguage() {
            document.querySelectorAll('.lang-en').forEach(function (el) {
                el.classList.toggle('hidden', language !== 'en');
            });
            document.querySelectorAll('.lang-zh').forEach(function (el) {
                el.classList.toggle('hidden', language !== 'zh');
            });
            document.getElementById('langBtn').textContent = language === 'en' ? '中文' : 'EN';
            document.getElementById('loginBtn').textContent = language === 'en' ? 'Sign in' : '登入';
            document.getElementById('logoutBtn').textContent = language === 'en' ? 'Log out' : '登出';
            document.getElementById('cleanUsersBtn').textContent = language === 'en' ? 'Clean all user data' : '清除所有使用者資料';
        }

        function escapeText(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character];
            });
        }

        function basicAuthHeader(username, password) {
            const bytes = new TextEncoder().encode(username + ':' + password);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return 'Basic ' + btoa(binary);
        }

        async function adminFetch(path, options, refreshed) {
            const request = Object.assign({ cache: 'no-store' }, options || {});
            const headers = Object.assign({}, request.headers || {});
            if (authHeader) {
                headers.Authorization = authHeader;
                headers['X-CC-Admin'] = authHeader;
            }
            request.headers = headers;
            let response;
            try {
                response = await fetch(apiUrl(path), request);
            } catch (error) {
                if (refreshed !== 'again' && refreshed !== true) {
                    await new Promise(function (resolve) { setTimeout(resolve, 700); });
                    return adminFetch(path, options, 'again');
                }
                if (refreshed !== true && typeof refreshCreativityApi === 'function' && await refreshCreativityApi()) {
                    return adminFetch(path, options, true);
                }
                throw new Error('0');
            }
            if (!response.ok && refreshed !== true && (response.status === 502 || response.status === 503 || response.status === 530) &&
                typeof refreshCreativityApi === 'function' && await refreshCreativityApi()) {
                return adminFetch(path, options, true);
            }
            return response;
        }

        async function adminGet(path) {
            const response = await adminFetch(path, { headers: { Authorization: authHeader } });
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
        }

        function showLogin(message) {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('records').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginError').textContent = message || '';
        }

        function showRecords() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('records').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
        }

        function field(label, value) {
            const text = String(value || '').trim();
            return '<p class="line"><strong>' + escapeText(label) + ':</strong> ' +
                (text ? escapeText(text) : '<span class="muted">(left blank)</span>') + '</p>';
        }

        function sortText(raw) {
            let items = raw;
            if (typeof raw === 'string') {
                try { items = JSON.parse(raw || '[]'); } catch (error) { return String(raw || ''); }
            }
            if (!Array.isArray(items)) return '';
            return items.map(function (item) {
                return item && item.text ? item.text : '';
            }).filter(Boolean).join(', ');
        }

        function inputRoundLabel(round) {
            const number = Number(round);
            const teen = number % 100;
            const suffix = teen >= 11 && teen <= 13 ? 'th'
                : number % 10 === 1 ? 'st'
                : number % 10 === 2 ? 'nd'
                : number % 10 === 3 ? 'rd'
                : 'th';
            return {
                en: number + suffix + ' input',
                zh: '第' + number + '次輸入'
            };
        }

        function responseHasAnswers(responses) {
            return Object.keys(responses || {}).some(function (key) {
                if (key === 'attempts') return false;
                const value = String(responses[key] == null ? '' : responses[key]).trim();
                return value !== '' && value !== '[]' && value !== '{}';
            });
        }

        function activityInputRounds(responses, latestDrawing) {
            const attempts = responses && Array.isArray(responses.attempts) ? responses.attempts : [];
            const rounds = attempts.map(function (attempt, index) {
                return {
                    round: attempt && attempt.round ? attempt.round : index + 1,
                    responses: attempt && attempt.responses ? attempt.responses : {},
                    drawingDataUrl: attempt && attempt.drawingDataUrl ? attempt.drawingDataUrl : ''
                };
            }).filter(function (round) {
                return responseHasAnswers(round.responses) || (typeof round.drawingDataUrl === 'string' && round.drawingDataUrl.indexOf('data:image') === 0);
            });
            const current = Object.assign({}, responses || {});
            delete current.attempts;
            if (responseHasAnswers(current)) {
                rounds.push({ round: rounds.length + 1, responses: current, drawingDataUrl: latestDrawing || '' });
            } else if (!rounds.length && latestDrawing) {
                rounds.push({ round: 1, responses: {}, drawingDataUrl: latestDrawing });
            }
            return rounds;
        }

        function answerLines(responses, lines) {
            let body = '';
            lines.forEach(function (line) {
                const value = line[0].indexOf('category') === 0 ? sortText(responses[line[0]]) : responses[line[0]];
                body += field(line[1], value);
            });
            return body;
        }

        function drawingLine(dataUrl) {
            if (typeof dataUrl === 'string' && dataUrl.indexOf('data:image') === 0) {
                return '<p class="line"><strong><span class="lang-en">Drawing</span><span class="lang-zh">圖畫</span>:</strong></p>' +
                    '<img class="drawing" alt="Drawing" src="' + dataUrl + '">';
            }
            return '<p class="line"><strong><span class="lang-en">Drawing</span><span class="lang-zh">圖畫</span>:</strong> ' +
                '<span class="muted"><span class="lang-en">No drawing saved.</span><span class="lang-zh">尚未保存圖畫。</span></span></p>';
        }

        function activityBlock(title, responses, lines, withDrawing, latestDrawing) {
            let body = '<h3>' + escapeText(title) + '</h3>';
            const rounds = activityInputRounds(responses, withDrawing ? latestDrawing : '');
            if (!rounds.length) return body + '<p class="muted">Nothing saved yet.</p>';
            rounds.forEach(function (round) {
                const label = inputRoundLabel(round.round);
                body += '<section class="input-block">';
                body += '<h4><span class="lang-en">' + label.en + ':</span><span class="lang-zh">' + label.zh + '：</span></h4>';
                if (withDrawing) body += drawingLine(round.drawingDataUrl);
                body += answerLines(round.responses, lines);
                body += '</section>';
            });
            return body;
        }

        function recordLabel(status) {
            const labels = {
                valid: 'Counted',
                main_use: 'Usual use',
                impossible: 'Not possible',
                vague: 'Too general',
                nonsense: 'Not a real idea',
                duplicate: 'Same idea again',
                empty: 'Empty'
            };
            return labels[status] || status || '—';
        }

        function analysisLines(result) {
            if (!result || !Array.isArray(result.objects)) return '';
            return result.objects.map(function (objectResult) {
                const lines = (objectResult.items || []).map(function (item, index) {
                    const category = item.status === 'valid' ? (item.categoryEn || '—') : '—';
                    return (index + 1) + '. ' + (item.answer || '—') +
                        ' — Record: ' + recordLabel(item.status) + ' — Category: ' + category;
                }).join('\n');
                return '<p class="line"><strong>' + escapeText(objectResult.en || 'Object') +
                    '</strong> — Fluency ' + escapeText(objectResult.fluency) +
                    ', Flexibility ' + escapeText(objectResult.flexibility) +
                    ', Total ' + escapeText(objectResult.total) + '<br>' +
                    escapeText(lines).replace(/\n/g, '<br>') + '</p>';
            }).join('');
        }

        function scoreFields(result) {
            return field('Creativity Scores', result.total) +
                field('Fluency', result.fluency) +
                field('Flexibility', result.flexibility);
        }

        function checkBlock(title, submission) {
            let body = '<h3>' + escapeText(title) + '</h3>';
            if (!submission || !submission.responses || !submission.responses.result) {
                return body + '<p class="muted">Nothing saved yet.</p>';
            }
            const responses = submission.responses;
            const attempts = Array.isArray(responses.attempts) && responses.attempts.length
                ? responses.attempts
                : [{ savedAt: responses.savedAt, result: responses.result }];
            if (attempts.length === 1) {
                body += scoreFields(attempts[0].result || {});
                body += analysisLines(attempts[0].result || {});
                return body;
            }
            attempts.forEach(function (attempt, index) {
                const label = inputRoundLabel(index + 1);
                const when = attempt.savedAt ? String(attempt.savedAt).slice(0, 16).replace('T', ' ') : '';
                body += '<section class="input-block">';
                body += '<h4><span class="lang-en">' + label.en + ':</span><span class="lang-zh">' + label.zh + '：</span></h4>';
                if (when) body += field('Saved', when);
                body += scoreFields(attempt.result || {});
                body += analysisLines(attempt.result || {});
                body += '</section>';
            });
            return body;
        }

        function renderRecord(details) {
            const user = details.user || {};
            const consent = details.consent || {};
            const submissions = details.submissions || [];
            const byId = {};
            submissions.forEach(function (item) { byId[item.activityId] = item; });
            const animal = (byId[1] || {}).responses || null;
            const drawing = details.drawingDataUrl || ((byId[1] || {}).metadata || {}).animalDrawingDataUrl || '';
            const parentSignature = consent.parentSignatureDataUrl || '';
            const signature = consent.participantSignatureDataUrl || '';
            let html = '<h2>' + escapeText(user.name || 'Participant') + '</h2>';
            html += '<button class="danger delete-user" id="deleteUserBtn" type="button">' +
                '<span class="lang-en">Delete this user</span><span class="lang-zh">刪除這位使用者</span></button>';
            html += '<p class="clean-status" id="deleteStatus"></p>';
            html += '<h3>Personal information</h3>';
            html += field('Name', user.name);
            html += field('Username', user.username);
            html += field('Age', user.age);
            html += field('Email', user.email);
            html += field('Language', user.language === 'zh' ? '中文' : 'English');
            html += field('Joined', user.joinedDate ? String(user.joinedDate).slice(0, 10) : '');
            html += '<h3>Consent</h3>';
            if (!details.consent) {
                html += '<p class="muted">No consent saved.</p>';
            } else {
                html += field('Parent or guardian', consent.parentName);
                html += field('Name on consent', consent.participantName);
                html += field('Signing date', consent.participantDate || consent.signedDate);
                html += '<p><strong>Parent or guardian signature</strong></p>';
                html += parentSignature.indexOf('data:image') === 0
                    ? '<img class="signature" alt="Parent signature" src="' + parentSignature + '">'
                    : '<p class="muted">No parent signature saved.</p>';
                html += '<p><strong>Child signature</strong></p>';
                html += signature.indexOf('data:image') === 0
                    ? '<img class="signature" alt="Child signature" src="' + signature + '">'
                    : '<p class="muted">No child signature saved.</p>';
            }
            html += activityBlock('1. Transformation of Animals', animal, [
                ['animalName', 'Name of the new animal'],
                ['animalDescription', 'Description']
            ], true, drawing);
            html += activityBlock('2. What If...?', (byId[2] || {}).responses || null, [1, 2, 3, 4, 5, 6].map(function (n) {
                return ['Result' + n, 'Result ' + n];
            }));
            html += activityBlock('3. Word Association', (byId[3] || {}).responses || null, [1, 2, 3, 4, 5].map(function (n) {
                return ['word' + n, 'Word ' + n];
            }).concat([['wordStory', 'Story']]));
            html += activityBlock('4. Penguin in the Desert', (byId[4] || {}).responses || null, [1, 2, 3, 4, 5].map(function (n) {
                return ['idea' + n, 'Idea ' + n];
            }));
            html += activityBlock('5. Brainstorming', (byId[5] || {}).responses || null, [
                ['solution1', 'Solution 1'],
                ['solution2', 'Solution 2'],
                ['solution3', 'Solution 3'],
                ['solution4', 'Solution 4'],
                ['category1', 'Things we can do right now'],
                ['category2', 'Things we can do, but need help from others'],
                ['category3', 'Hard to do'],
                ['category4', 'Fun ideas but not really helpful']
            ]);
            html += checkBlock('Creativity check before training', byId[101]);
            html += checkBlock('Creativity check after training', byId[102]);
            return html;
        }

        async function openUser(user, button) {
            document.querySelectorAll('.user-button').forEach(function (item) {
                item.classList.remove('selected');
            });
            if (button) button.classList.add('selected');
            selectedUser = user;
            const record = document.getElementById('userRecord');
            record.innerHTML = '<p class="muted">Loading...</p>';
            try {
                const details = await adminGet('/api/admin/users/' + encodeURIComponent(user.id));
                selectedUser = (details.user || user);
                record.innerHTML = renderRecord(details);
                applyLanguage();
                const deleteButton = document.getElementById('deleteUserBtn');
                if (deleteButton) deleteButton.addEventListener('click', deleteSelectedUser);
            } catch (error) {
                record.innerHTML = '<p class="error">Could not load this record.</p>';
            }
        }

        async function deleteSelectedUser() {
            const user = selectedUser;
            if (!user || !user.id) return;
            const name = String(user.name || user.username || '').trim() ||
                (language === 'en' ? 'this user' : '這位使用者');
            const first = language === 'en'
                ? 'Delete this user only: ' + name + '? This removes their saved information, drawing, activity answers, and creativity scores. Other users stay.'
                : '只刪除這位使用者：' + name + '？這會清除這位使用者已保存的資料、圖畫、活動答案和創意分數。其他使用者會保留。';
            if (!window.confirm(first)) return;
            const second = language === 'en'
                ? 'Please confirm again. Deleting this user cannot be undone. Delete ' + name + ' now?'
                : '請再確認一次。刪除後無法復原。現在刪除 ' + name + ' 嗎？';
            if (!window.confirm(second)) return;
            const status = document.getElementById('deleteStatus');
            const button = document.getElementById('deleteUserBtn');
            if (button) button.disabled = true;
            if (status) status.textContent = language === 'en' ? 'Deleting...' : '正在刪除...';
            try {
                await adminPost('/api/admin/delete-user', { userId: user.id });
                selectedUser = null;
                document.getElementById('userRecord').innerHTML = language === 'en'
                    ? '<p class="muted">Choose a name to see what that child saved.</p>'
                    : '<p class="muted">請選擇一個名字，查看該參加者保存的內容。</p>';
                await loadUsers();
                document.getElementById('cleanStatus').textContent = language === 'en'
                    ? name + ' has been deleted. Other users are still saved.'
                    : name + ' 已刪除。其他使用者仍然保存。';
            } catch (error) {
                if (button) button.disabled = false;
                if (status) status.textContent = language === 'en'
                    ? 'This user could not be deleted. Check the internet connection, then try again.'
                    : '未能刪除這位使用者。請檢查網絡連線，然後再試。';
            }
        }

        async function adminPost(path, payload) {
            const response = await adminFetch(path, {
                method: 'POST',
                headers: { Authorization: authHeader, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload || {})
            });
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
        }

        async function cleanAllUsers() {
            const first = language === 'en'
                ? 'This will erase every child\'s saved information, drawings, activity answers, and creativity scores. Do you want to continue?'
                : '這會清除所有參加者已保存的資料、圖畫、活動答案和創意分數。要繼續嗎？';
            if (!window.confirm(first)) return;
            const second = language === 'en'
                ? 'Please confirm again. Cleaning all user data cannot be undone. Clean all user data now?'
                : '請再確認一次。清除所有使用者資料後無法復原。現在清除嗎？';
            if (!window.confirm(second)) return;
            const status = document.getElementById('cleanStatus');
            status.textContent = language === 'en' ? 'Cleaning...' : '正在清除...';
            try {
                await adminPost('/api/admin/clear-users');
                document.getElementById('userRecord').innerHTML = language === 'en'
                    ? '<p class="muted">Choose a name to see what that child saved.</p>'
                    : '<p class="muted">請選擇一個名字，查看該參加者保存的內容。</p>';
                await loadUsers();
                status.textContent = language === 'en'
                    ? 'All user data has been cleaned.'
                    : '所有使用者資料已清除。';
            } catch (error) {
                status.textContent = language === 'en'
                    ? 'The record book could not be cleaned. Check the internet connection, then try again.'
                    : '未能清除記錄冊。請檢查網絡連線，然後再試。';
            }
        }

        async function loadUsers() {
            const data = await adminGet('/api/admin/users');
            const users = data.users || [];
            const list = document.getElementById('userList');
            showRecords();
            if (!users.length) {
                list.innerHTML = '<p class="muted">No children have registered yet.</p>';
                return;
            }
            list.innerHTML = '<h2>Registered children</h2>';
            users.forEach(function (user) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'user-button';
                const done = (user.completedActivities || []).length;
                button.innerHTML = '<strong>' + escapeText(user.name) + '</strong><span>' +
                    escapeText(user.email || '') + ' · ' + done + '/5 activities</span>';
                button.addEventListener('click', function () { openUser(user, button); });
                list.appendChild(button);
            });
            showRecords();
        }

        function typedValue(id) {
            return String((document.getElementById(id) || {}).value || '')
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .trim();
        }

        async function signIn() {
            const username = typedValue('username');
            const password = typedValue('password');
            if (!username || !password) {
                document.getElementById('loginError').textContent = language === 'en'
                    ? 'Please enter the username and password.'
                    : '請輸入用戶名和密碼。';
                return;
            }
            if (typeof refreshCreativityApi === 'function') {
                try { await refreshCreativityApi(); } catch (ignore) {}
            }
            authHeader = basicAuthHeader(username, password);
            try {
                await loadUsers();
                sessionStorage.setItem('cc_admin_auth', authHeader);
                document.getElementById('loginError').textContent = '';
            } catch (error) {
                authHeader = '';
                sessionStorage.removeItem('cc_admin_auth');
                const status = Number(error && error.message);
                document.getElementById('loginError').textContent = status === 401
                    ? (language === 'en'
                        ? 'That username or password is not correct.'
                        : '用戶名或密碼不正確。')
                    : (language === 'en'
                        ? 'The record book could not be opened. Check the internet connection, then try again.'
                        : '未能開啟記錄冊。請檢查網絡連線，然後再試。');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            signIn();
        });
        document.getElementById('langBtn').addEventListener('click', function () {
            language = language === 'en' ? 'zh' : 'en';
            applyLanguage();
        });
        document.getElementById('cleanUsersBtn').addEventListener('click', cleanAllUsers);
        document.getElementById('logoutBtn').addEventListener('click', function () {
            authHeader = '';
            sessionStorage.removeItem('cc_admin_auth');
            showLogin('');
        });
        applyLanguage();
        if (authHeader) {
            loadUsers().catch(function () { showLogin(''); });
        }
    </script>
</body>
</html>
